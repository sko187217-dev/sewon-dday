<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b49">
<title>세원정보 | 새로운 출발 D-Day</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#fff;
background:radial-gradient(circle at 80% 20%,#2464a8 0,#0b2c61 38%,#061536 100%)}
main{width:min(760px,100%);text-align:center;border:1px solid #ffffff35;
border-radius:28px;padding:clamp(24px,6vw,52px);background:#061536a8;
box-shadow:0 24px 70px #0006}
.brand{font-size:clamp(25px,5vw,42px);font-weight:900;letter-spacing:.04em}
.eng{font-size:13px;letter-spacing:.2em;color:#b8d8ff;margin-top:5px}
.line{height:1px;background:#ffffff35;margin:25px 0}
.tag{font-size:clamp(22px,4vw,32px);font-weight:800;color:#ffd36a}
.sub{color:#d7e7ff;margin:12px 0 28px}
.date{font-size:clamp(18px,3vw,24px);font-weight:700}
#count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
.unit{background:#ffffff12;border:1px solid #ffffff25;border-radius:16px;padding:16px 6px}
.num{font-size:clamp(28px,7vw,54px);font-weight:900;font-variant-numeric:tabular-nums}
.label{font-size:13px;color:#c6dcff;margin-top:4px}
.foot{font-size:13px;color:#bdd1ed;line-height:1.7}
@media(max-width:430px){#count{gap:6px}.unit{padding:12px 3px}.label{font-size:11px}}
</style>
</head>
<body>
<main>
  <div class="brand">세원정보</div>
  <div class="eng">SEWON INFORMATION</div>
  <div class="line"></div>
  <div class="tag">새로운 출발 ❤️</div>
  <div class="sub">누군가 와 함께할 행복한 미래를 기다리며</div>
  <div class="date">2027년 6월 15일</div>
  <section id="count" aria-live="polite">
    <div class="unit"><div class="num" id="days">---</div><div class="label">일</div></div>
    <div class="unit"><div class="num" id="hours">--</div><div class="label">시간</div></div>
    <div class="unit"><div class="num" id="minutes">--</div><div class="label">분</div></div>
    <div class="unit"><div class="num" id="seconds">--</div><div class="label">초</div></div>
  </section>
  <div class="foot" id="message">   <br>   </div>
</main>
<script>
const target = new Date(2027, 5, 15, 0, 0, 0); // 한국 시간 기준 2027-06-15 00:00
const $ = id => document.getElementById(id);
function update(){
  let diff = target.getTime() - Date.now();
  if(diff <= 0){
    ["days","hours","minutes","seconds"].forEach(id => $(id).textContent = "0");
    $("message").textContent = "          ";
    return;
  }
  const day = Math.floor(diff/86400000); diff %= 86400000;
  const hour = Math.floor(diff/3600000); diff %= 3600000;
  const minute = Math.floor(diff/60000); diff %= 60000;
  const second = Math.floor(diff/1000);
  $("days").textContent = day.toLocaleString("ko-KR");
  $("hours").textContent = String(hour).padStart(2,"0");
  $("minutes").textContent = String(minute).padStart(2,"0");
  $("seconds").textContent = String(second).padStart(2,"0");
}
update(); setInterval(update,1000);
</script>
</body>
</html>
